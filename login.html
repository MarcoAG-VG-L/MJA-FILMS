<body class="login-page">

    <main class="login-screen">
        <div class="login-backdrop" aria-hidden="true"></div>

        <section class="login-card" aria-labelledby="login-title">
            <a class="brand login-brand" href="login.html" aria-label="MJA Films">
                <span class="brand-mark" aria-hidden="true">M</span>
                <span>MJA <strong>FILMS</strong></span>
            </a>

            <p class="eyebrow">TU PRÓXIMA HISTORIA EMPIEZA AQUÍ</p>
            <h1 id="login-title">Bienvenido<br>de nuevo.</h1>
            <p class="login-copy">Inicia sesión para descubrir todo lo que tenemos preparado para ti.</p>

            <!-- [LARAVEL] action="{{ route('login') }}" y añade @csrf dentro del form -->
            <form id="login-form" action="/login" method="post" novalidate>

                <label for="username">Usuario</label>
                <!-- [LARAVEL] value="{{ old('username') }}" -->
                <input id="username" name="username" type="text" placeholder="Tu nombre de usuario" autocomplete="username" required>

                <label for="password">Contraseña</label>
                <div class="password-field">
                    <input id="password" name="password" type="password" placeholder="Tu contraseña" autocomplete="current-password" required>
                    <button class="password-toggle" id="toggle-password" type="button" aria-label="Mostrar contraseña" aria-pressed="false">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>

                <label class="remember">
                    <input id="remember" name="remember" type="checkbox">
                    <span>Recordarme en este equipo</span>
                </label>

                <!-- [LARAVEL] @error('username') {{ $message }} @enderror -->
                <p class="login-error" id="login-error" role="alert" aria-live="polite"></p>

                <button class="button button-primary login-submit" type="submit">
                    <span class="submit-text">Entrar</span>
                    <span class="submit-arrow" aria-hidden="true">→</span>
                    <span class="spinner" aria-hidden="true"></span>
                </button>
            </form>

            <!-- [LARAVEL] Borra esta pista cuando el login sea real -->
            <p class="login-footnote">Acceso de administrador · Demo: <kbd>admin</kbd> / <kbd>1234</kbd></p>
        </section>

        <p class="login-caption">UNA BUENA PELÍCULA LO CAMBIA TODO.</p>
